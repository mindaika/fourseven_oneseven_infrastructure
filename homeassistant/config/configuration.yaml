
# Loads default set of integrations. Do not remove.
default_config:

# Helpers
input_boolean:
  home_occupied:
    name: Home Occupied
    icon: mdi:home-account
  asleep:
    name: Asleep
    icon: mdi:sleep

# Reverse proxy configuration
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.19.0.0/16
  login_attempts_threshold: 10

# Recorder: exclude ephemeral Docker network interfaces.
#
# Every container restart creates a veth interface with a new random name,
# and the system-monitor integration turns each into a permanent statistic
# that logs a few rows and then goes dead forever. As of 2026-08-11 that is
# 1,212 dead metrics and 66,774 orphaned statistics rows, and the set grows
# without bound.
#
# This stops future recording only - existing rows are unaffected and are
# left in place deliberately (removal is destructive and unnecessary).
#
# Voltage/amperage sensors are NOT excluded: they are noisy but are useful
# electrical diagnostics, and are unrelated to the veth problem.
recorder:
  exclude:
    entity_globs:
      - sensor.*_veth*
      - sensor.pi5_br_*
      - sensor.pi4_br_*

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

template:
  - sensor:
      - name: "Untracked Energy This Month"
        unique_id: untracked_energy_this_month
        unit_of_measurement: "kWh"
        state: >
          {% set grid = states('sensor.elec_account_6537807941_current_bill_electric_usage_to_date') | float(0) %}
          {% set metered = [
            'sensor.schoolhouse_this_month_s_consumption',
            'sensor.schoolhouse_blue_this_month_s_consumption',
            'sensor.g1_this_month_s_consumption',
            'sensor.p1_this_month_s_consumption',
            'sensor.p2_this_month_s_consumption',
            'sensor.p3_this_month_s_consumption',
            'sensor.aqara_g1_summation_delivered',
            'sensor.aqara_lumi_light_agl001_summation_delivered',
            'sensor.tall_bookshelf_right_top_this_month_s_consumption',
            'sensor.tall_bookshelf_right_bottom_this_month_s_consumption',
            'sensor.bedroom_tapo_1_top_this_month_s_consumption',
            'sensor.bedroom_tapo_1_bottom_this_month_s_consumption',
            'sensor.headphones_this_month_s_consumption',
            'sensor.plant_light_this_month_s_consumption',
            'sensor.mid_fan_this_month_s_consumption',
            'sensor.alarm_clock_this_month_s_consumption',
            'sensor.rembrandt_this_month_s_consumption',
            'sensor.record_player_this_month_s_consumption',
            'sensor.humidifier_this_month_s_consumption',
            'sensor.yr_west_1_bottom_this_month_s_consumption',
            'sensor.laptop_this_month_s_consumption',
            'sensor.computer_this_month_s_consumption' ] %}
          {% set ns = namespace(tracked=0) %}
          {% for s in metered %}
            {% set ns.tracked = ns.tracked + states(s) | float(0) %}
          {% endfor %}
          {{ [grid - ns.tracked, 0] | max | round(3) }}
