name: oura

services:
  oura-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: oura-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the localhost-based value from .env (that one's for
      # host-side scripts like oura-sync.sh) — inside this container,
      # Postgres is reachable by its container name on infra_network.
      - CLAUDE_READER_DATABASE_URL=${CLAUDE_READER_DATABASE_URL_CONTAINER}
    volumes:
      # OAuth client registrations and access tokens. Must outlive the
      # container: connectors that self-register via RFC 7591 cache their
      # client_id indefinitely and never retry /register, so losing this
      # directory means every connector has to be removed and re-added.
      # Contains client secrets and bearer tokens in cleartext.
      - ./data:/data
    # No published port: reached only via nginx at
    # https://oura-mcp.garbanzo.monster (LAN-restricted there, see
    # infrastructure/nginx/templates/default.conf.template). Publishing
    # 8765 directly would bypass both the LAN allowlist and OAuth.
    networks:
      - infra_network
    # No depends_on: postgres lives in a different compose project
    # (infrastructure/compose.yaml) and is already running continuously.

networks:
  infra_network:
    external: true
