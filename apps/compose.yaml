name: apps

services:
  # Jobify - AI-powered job application assistant
  jobify:
    build:
      context: /home/mindaika/Source/jobify
      dockerfile: Dockerfile.prod
    container_name: jobify
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - DATABASE_URL=postgresql://garbanzo:${POSTGRES_PASSWORD}@192.168.1.54:5432/garbanzodb
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    ports:
      - "5004:5004"
    networks:
      - apps_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Pixify - AI-powered image generation service
  pixify:
    build:
      context: /home/mindaika/Source/pixify
      dockerfile: Dockerfile.prod
    container_name: pixify
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    ports:
      - "5005:5005"
    networks:
      - apps_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # DanceTrak - Dance video tracker and organizer
  dancetrak:
    build:
      context: /home/mindaika/Source/dancetrak
      dockerfile: Dockerfile.prod
    container_name: dancetrak
    restart: unless-stopped
    environment:
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - DATABASE_URL=postgresql://garbanzo:${POSTGRES_PASSWORD}@192.168.1.54:5432/garbanzodb
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - VIDEO_STORAGE_PATH=/mnt/dancetrak
    ports:
      - "5006:5006"
    volumes:
      - /mnt/dancetrak:/mnt/dancetrak
    networks:
      - apps_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # homelab-api - Home Assistant statistics for the dashboard.
  # Reads Postgres as ha_api_reader (SELECT on the reporting views only) and
  # never exposes a database credential to the browser.
  homelab-api:
    build:
      context: /home/mindaika/Source/fourseven_oneseven_infrastructure/ha_export
      dockerfile: Dockerfile
    container_name: homelab-api
    restart: unless-stopped
    environment:
      - HA_API_DATABASE_URL=postgresql://ha_api_reader:${HA_API_READER_PASSWORD}@192.168.1.54:5432/garbanzodb
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
    ports:
      - "5007:5007"
    networks:
      - apps_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5007/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  apps_network:
    name: apps_network
    driver: bridge

