# Home Assistant metric allowlist - phase 1 deliverable.
#
# This file IS the selection contract. Membership is reviewed by hand;
# unit metadata is generated from HA so it cannot drift from reality.
# Discovery by unit_class is an AUDIT that reports unclassified metrics,
# never a mechanism that adds them.
#
# max_plausible_kw is sustained average power, not energy: multiplying by
# bucket duration gives the kWh ceiling, so one value serves hourly,
# daily and billing-period grains alike.


